[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "medoids"
version = "0.1.0"
description = "Exact medoid and k-medoids for large Euclidean data, without a distance matrix."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alfonso Mulet Vázquez" }]
keywords = ["medoid", "k-medoids", "clustering", "pam", "clara", "robust-statistics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.24", "numba>=0.59"]

[project.urls]
Repository = "https://github.com/TitoRykun/medoids"
Issues = "https://github.com/TitoRykun/medoids/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/medoids"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast tests of a single function",
    "integration: end-to-end tests through the public API",
]

[tool.coverage.run]
source = ["medoids"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "ANN"]

[tool.ruff.lint.per-file-ignores]
# Numerical kernels ported verbatim from the medoids research code.
"src/medoids/_kernels/*" = ["ANN", "E501", "E741", "E702", "F401", "F841", "B", "UP", "I"]
"tests/*" = ["ANN"]
